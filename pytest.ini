[pytest]
; 让测试能直接 import 项目根目录下的模块（tibetan / models / app / export_docx）
pythonpath = .
testpaths = tests
addopts = -q
filterwarnings =
    ; starlette 的 TestClient 提示改用 httpx2，与本项目无关，过滤掉保持输出干净。
    ;
    ; 注意类别是 UserWarning 而不是 DeprecationWarning ——
    ; starlette.exceptions.StarletteDeprecationWarning 名字虽然叫 Deprecation，
    ; 但继承的是 UserWarning。按 DeprecationWarning 过滤是**不起作用**的。
    ; 这里按「消息 + 类别」精确匹配，不写成 ignore::Warning 之类的宽泛规则，
    ; 免得把将来 Python 或依赖库真正的弃用提醒一起吞掉。
    ignore:Using .httpx. with .starlette.testclient. is deprecated.*:UserWarning
